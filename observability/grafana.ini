# run.sh supplies these paths and ports for each disposable session.
[paths]
data = ${ZINFER_OBSERVABILITY_SESSION}/grafana
logs = ${ZINFER_OBSERVABILITY_SESSION}/logs
plugins = ${ZINFER_OBSERVABILITY_SESSION}/plugins
provisioning = ${ZINFER_OBSERVABILITY_SESSION}/provisioning

[server]
http_addr = 127.0.0.1
http_port = ${ZINFER_GRAFANA_PORT}

[auth]
disable_login_form = true

# This local dashboard is readable without signing in.
[auth.anonymous]
enabled = true
org_role = Viewer

[users]
allow_sign_up = false

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[dashboards]
min_refresh_interval = 1s
default_home_dashboard_path = ${ZINFER_OBSERVABILITY_DIR}/dashboards/zinfer.json

[plugins]
# run.sh explicitly installs only the Prometheus plugin into temporary storage.
preinstall_disabled = true

[log]
mode = console
level = warn
