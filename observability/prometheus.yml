# run.sh copies this config into the temporary session, adjusting the target
# port when ZINFER_PORT is set. The default target is the local Zig server.
global:
  scrape_interval: 1s
  scrape_timeout: 1s

scrape_configs:
  - job_name: zinfer
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8080"]
