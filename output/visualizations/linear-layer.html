<div id="linear-layer-explorer">
  <div class="viz-controls">
    <label class="form-label">Input x₁: <span data-value="0" class="tabular-nums">1</span><input class="form-range" type="range" min="-4" max="4" step="0.5" value="1" data-input="0"></label>
    <label class="form-label">Input x₂: <span data-value="1" class="tabular-nums">2</span><input class="form-range" type="range" min="-4" max="4" step="0.5" value="2" data-input="1"></label>
    <label class="form-label">Input x₃: <span data-value="2" class="tabular-nums">3</span><input class="form-range" type="range" min="-4" max="4" step="0.5" value="3" data-input="2"></label>
  </div>
  <div class="viz-row" style="margin-top:12px">
    <span class="text-small">Inspect</span>
    <button type="button" class="btn" data-output="0" aria-pressed="true">Output y₁</button>
    <button type="button" class="btn" data-output="1" aria-pressed="false">Output y₂</button>
  </div>
  <div data-network></div>
  <div class="viz-row text-small tabular-nums" data-detail aria-live="polite"></div>
</div>
<style>
  #linear-layer-explorer { color:var(--foreground); }
  #linear-layer-explorer [data-network] svg { display:block; width:100%; }
  #linear-layer-explorer .network-label { fill:var(--foreground); }
  #linear-layer-explorer .network-secondary { fill:var(--muted-foreground); }
  #linear-layer-explorer .network-edge { stroke:var(--border); stroke-width:1; }
  #linear-layer-explorer .network-active { stroke:var(--viz-series-1); stroke-width:2; }
  #linear-layer-explorer .network-node { fill:var(--background); stroke:var(--border); stroke-width:1; }
  #linear-layer-explorer .network-selected { fill:color-mix(in srgb, var(--viz-series-1) 12%, var(--background)); stroke:var(--viz-series-1); }
  #linear-layer-explorer .weight-backing { fill:var(--background); }
</style>
<script>
(() => {
  const root = document.getElementById('linear-layer-explorer');
  const network = root.querySelector('[data-network]');
  const detail = root.querySelector('[data-detail]');
  const values = [1, 2, 3];
  const weights = [[1, 0, 1], [0, 2, 0]];
  const biases = [0.5, -1];
  let selected = 0;
  const fmt = n => String(Object.is(n, -0) ? 0 : n);
  const subs = ['₁', '₂', '₃'];
  function draw() {
    const width = Math.max(280, network.getBoundingClientRect().width);
    const left = 54, right = width - 54;
    const inputY = [75, 165, 255], outputY = [115, 215];
    const totals = weights.map((row, j) => row.reduce((sum, w, i) => sum + w * values[i], biases[j]));
    let edges = '', labels = '', nodes = '';
    for (let j = 0; j < 2; j++) {
      for (let i = 0; i < 3; i++) {
        edges += `<line class="network-edge ${j === selected ? 'network-active' : ''}" x1="${left + 26}" y1="${inputY[i]}" x2="${right - 26}" y2="${outputY[j]}"/>`;
        if (j === selected) {
          const t = j === 0 ? 0.44 : 0.64;
          const x = left + 26 + t * (right - left - 52);
          const y = inputY[i] + t * (outputY[j] - inputY[i]);
          labels += `<rect class="weight-backing" x="${x - 24}" y="${y - 11}" width="48" height="22" rx="4"/><text class="network-label" x="${x}" y="${y + 5}" text-anchor="middle">w: ${weights[j][i]}</text>`;
        }
      }
    }
    for (let i = 0; i < 3; i++) {
      nodes += `<text class="network-secondary" x="${left}" y="${inputY[i] - 36}" text-anchor="middle">x${subs[i]}</text><circle class="network-node" cx="${left}" cy="${inputY[i]}" r="26"/><text class="network-label" x="${left}" y="${inputY[i] + 5}" text-anchor="middle">${fmt(values[i])}</text>`;
    }
    for (let j = 0; j < 2; j++) {
      nodes += `<text class="network-secondary" x="${right}" y="${outputY[j] - 36}" text-anchor="middle">y${subs[j]}</text><circle class="network-node ${j === selected ? 'network-selected' : ''}" cx="${right}" cy="${outputY[j]}" r="26"/><text class="network-label" x="${right}" y="${outputY[j] + 5}" text-anchor="middle">${fmt(totals[j])}</text><text class="network-secondary" x="${right}" y="${outputY[j] + 46}" text-anchor="middle">bias: ${biases[j]}</text>`;
    }
    network.innerHTML = `<svg viewBox="0 0 ${width} 298" role="img" aria-label="Three input features connect to two output features. Highlighted connections show the selected output's weights."><title>Linear layer: three inputs to two outputs</title>${edges}${labels}${nodes}</svg>`;
    const contributions = weights[selected].map((w, i) => fmt(w * values[i]));
    detail.textContent = `y${subs[selected]} · Contributions: ${contributions.join(', ')} · Bias: ${biases[selected]} · Total: ${fmt(totals[selected])}`;
  }
  root.querySelectorAll('[data-input]').forEach(input => input.addEventListener('input', () => {
    const index = Number(input.dataset.input);
    values[index] = Number(input.value);
    root.querySelector(`[data-value="${index}"]`).textContent = fmt(values[index]);
    draw();
  }));
  root.querySelectorAll('[data-output]').forEach(button => button.addEventListener('click', () => {
    selected = Number(button.dataset.output);
    root.querySelectorAll('[data-output]').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.output) === selected)));
    draw();
  }));
  new ResizeObserver(draw).observe(network);
  draw();
})();
</script>
